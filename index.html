<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtStyle Studio V6.4 – Dirk Eckert</title>
<style>
:root{
  --bg:#080a10;--bg2:#101524;--card:#151a28;--card2:#20263a;
  --border:#39425c;--purple:#8b5cf6;--pink:#ec4899;--green:#22c55e;
  --orange:#f59e0b;--red:#ef4444;--text:#fff;--muted:#aeb6cf;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:
radial-gradient(circle at top,#241044 0%,#0d1020 40%,#080a10 75%);min-height:100vh}
header{padding:18px 16px 32px;text-align:center;background:linear-gradient(135deg,#16002b,#111827,#31004f);border-bottom:1px solid #5b3b78}
.topbar{max-width:1200px;margin:auto;display:flex;justify-content:flex-end}
select,input,textarea{font:inherit}
.language-select{width:auto;min-width:180px;padding:12px 14px;border-radius:14px;background:#171a26;color:white;border:1px solid #555d76}
.logo{font-size:52px;margin:10px 0 6px} h1{margin:0;font-size:40px}.name{margin-top:8px;font-size:21px;color:#c084fc;font-weight:bold}.subtitle{margin-top:12px;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:25px 16px 70px}
.hero{padding:28px;border-radius:28px;background:linear-gradient(135deg,#5b087c,#9d004f);box-shadow:0 15px 45px rgba(0,0,0,.4);margin-bottom:25px}
.hero h2{margin-top:0}.hero p{line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;text-align:center}.stat-number{font-size:28px;font-weight:bold;color:#c084fc}.stat-label{margin-top:5px;font-size:13px;color:var(--muted)}
.section-title{margin:35px 0 18px;font-size:28px}
.presets{display:flex;flex-wrap:wrap;gap:10px}.preset{width:auto;margin:0;padding:12px 16px;background:#242b40;border:1px solid #49526b;border-radius:30px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;min-height:140px;padding:18px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:22px;cursor:pointer;transition:.18s;user-select:none}.card:hover{transform:translateY(-3px);border-color:var(--purple);background:var(--card2)}.card:active{transform:scale(.97)}.card:focus-visible,.option:focus-visible,button:focus-visible{outline:3px solid #c084fc;outline-offset:3px}.card.has-selection{border-color:var(--green);box-shadow:0 0 20px rgba(34,197,94,.15)}.card-icon{font-size:42px;margin-bottom:12px}.card-title{font-weight:bold;text-align:center}.selection-badge{display:none;position:absolute;top:10px;right:12px;min-width:25px;padding:4px 7px;border-radius:20px;background:var(--green);color:#06120a;font-size:12px;font-weight:bold}.card.has-selection .selection-badge{display:block}
#selectionArea{display:none;margin-top:28px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:25px}.selection-header{display:flex;align-items:center;justify-content:space-between;gap:15px}.selection-header h2{margin:0}.hint{color:var(--muted);line-height:1.5}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{position:relative;padding:15px 12px;text-align:center;background:var(--card2);border:2px solid #414960;border-radius:16px;cursor:pointer;transition:.15s}.option.active{background:#193727;border-color:var(--green)}.option.active:after{content:"✓";position:absolute;top:7px;right:10px;color:var(--green);font-weight:bold}
.panel{margin-top:30px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:25px}.selected-list{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border-radius:25px;background:#252d43;border:1px solid #46506c;font-size:14px}.chip strong{color:#c084fc}.empty{color:var(--muted)}
.file-input{width:100%;padding:14px;background:#0b0e16;border:1px dashed #5b6584;border-radius:15px;color:white}.reference-preview{display:none;margin-top:18px;text-align:center}.reference-preview img{max-width:100%;max-height:400px;border-radius:18px;border:2px solid var(--purple)}
textarea{width:100%;min-height:280px;padding:16px;resize:vertical;background:#080b12;color:white;border:2px solid #39435c;border-radius:17px;font-size:16px;line-height:1.55}textarea:focus{outline:none;border-color:var(--purple)}.prompt-info{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}button{padding:16px;border:none;border-radius:15px;color:white;font:inherit;font-size:16px;font-weight:bold;cursor:pointer}button:active{transform:scale(.97)}.primary{background:linear-gradient(135deg,#7c3aed,#db2777)}.green{background:linear-gradient(135deg,#15803d,#22c55e)}.orange{background:linear-gradient(135deg,#b45309,#f59e0b)}.secondary{background:linear-gradient(135deg,#334155,#111827)}.danger{background:linear-gradient(135deg,#7f1d1d,#ef4444)}.small-button{width:auto;margin:0;padding:9px 12px;font-size:13px;background:#293149}.close-selection{width:auto;margin:0;padding:10px 14px;background:#293149;font-size:14px}.status{min-height:25px;margin-top:15px;text-align:center;color:#86efac}
.library-search{width:100%;padding:14px;margin-bottom:15px;background:#0b0e16;color:white;border:1px solid #424b64;border-radius:14px}.saved-prompt{margin-top:12px;padding:16px;background:#0c101a;border:1px solid #333c52;border-radius:16px}.saved-header{display:flex;justify-content:space-between;gap:10px}.saved-title{color:#c084fc;font-weight:bold}.saved-text{margin-top:10px;color:#c5ccdf;line-height:1.5;font-size:14px;white-space:pre-wrap}.saved-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
body.rtl{direction:rtl}body.rtl .topbar{justify-content:flex-start}body.rtl .selection-badge,body.rtl .option.active:after{right:auto;left:10px}
footer{padding:35px 10px;text-align:center;color:#717a92}
@media(max-width:650px){h1{font-size:32px}.stats,.options,.button-grid{grid-template-columns:1fr}.categories{gap:11px}.card{min-height:125px}.card-icon{font-size:37px}.card-title{font-size:15px}.prompt-info{flex-direction:column}}

/* V6 clean navigation and responsive studio layout */
.category-toolbar{display:grid;gap:12px;margin:0 0 18px}
.category-search{width:100%;padding:15px 16px;border-radius:15px;background:#0b0e16;color:white;border:1px solid #424b64;font-size:16px}
.category-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.category-tabs .tab{flex:0 0 auto;width:auto;margin:0;padding:11px 15px;border-radius:30px;background:#1c2435;border:1px solid #3e4962;color:#dce4f7;font-size:14px}
.category-tabs .tab.active{background:linear-gradient(135deg,#6d28d9,#be185d);border-color:#c084fc;color:#fff}
main{max-width:1120px}
.hero{background:linear-gradient(125deg,#28105b,#4b145e 55%,#172c54);border:1px solid #68438e}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.categories{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{min-height:132px;background:linear-gradient(155deg,#171e2e,#101521);border:1px solid #35415a}
.card.has-selection{border:2px solid #22c55e}
.panel,#selectionArea{box-shadow:0 10px 28px rgba(0,0,0,.18)}
.section-title{font-size:25px}
@media(max-width:760px){.categories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.categories{gap:9px}.card{min-height:112px;padding:13px 7px}.card-icon{font-size:32px}.card-title{font-size:13px}.stats{gap:7px}.stat{padding:12px 5px}.stat-number{font-size:23px}.stat-label{font-size:11px}}
\n
.studio-dashboard{margin:26px 0 34px}
.dashboard-heading{margin-bottom:15px}
.dashboard-kicker{display:inline-block;color:var(--accent,#d7a86e);font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:6px}
.dashboard-heading h2{font-size:23px;margin:0 0 5px}
.dashboard-heading p{margin:0;color:var(--muted,#999);font-size:14px}
.studio-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.studio-tile{min-height:158px;border:1px solid rgba(255,255,255,.13);border-radius:17px;padding:16px;text-align:left;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;cursor:pointer;background:linear-gradient(145deg,#292b35,#171820);box-shadow:0 7px 20px rgba(0,0,0,.18);transition:transform .15s,border-color .15s}
.studio-tile:active{transform:scale(.98)}
.tile-beauty{background:linear-gradient(145deg,#57364e,#211923)}
.tile-space{background:linear-gradient(145deg,#253e60,#151b2b)}
.tile-trains{background:linear-gradient(145deg,#31584b,#17251f)}
.tile-broken{background:linear-gradient(145deg,#69432d,#261b19)}
.tile-worlds{background:linear-gradient(145deg,#45513c,#1c241d)}
.tile-photo{background:linear-gradient(145deg,#454957,#1c1e28)}
.tile-emoji{font-size:28px;line-height:1.1}
.tile-name{font-weight:800;font-size:16px}
.tile-desc{font-size:12px;color:rgba(255,255,255,.78);line-height:1.35}
.tile-arrow{font-size:12px;font-weight:700;margin-top:auto;padding-top:7px;color:#f2d4a8}
@media(max-width:430px){.studio-tiles{gap:9px}.studio-tile{min-height:145px;padding:12px}.tile-name{font-size:14px}.tile-desc{font-size:11px}}

</style>
</head>
<body>
<header>
  <div class="topbar"><select id="languageSelector" class="language-select"></select></div>
  <div class="logo">🎨✨</div><h1>ArtStyle Studio</h1><div class="name">Dirk Eckert</div>
  <div class="subtitle" id="subtitle"></div>
</header>
<main>
<section class="hero"><h2 id="welcomeTitle"></h2><p id="welcomeText"></p></section>
<div class="stats">
 <div class="stat"><div class="stat-number" id="selectedCount">0</div><div class="stat-label" id="selectedLabel"></div></div>
 <div class="stat"><div class="stat-number" id="categoryCount">0</div><div class="stat-label" id="categoryLabel"></div></div>
 <div class="stat"><div class="stat-number" id="savedCount">0</div><div class="stat-label" id="savedLabel"></div></div>
</div>

<section class="studio-dashboard" aria-label="Studio-Bereiche">
  <div class="dashboard-heading">
    <span class="dashboard-kicker">DEIN KREATIVBEREICH</span>
    <h2>Wähle dein Studio</h2>
    <p>Direkt zu den Themenwelten und Bildstilen.</p>
  </div>
  <div class="studio-tiles">
    <button class="studio-tile tile-beauty" onclick="goToStudio('people')"><span class="tile-emoji">💄</span><span class="tile-name">Beauty & Glamour</span><span class="tile-desc">Porträts, Make-up, Posen</span><span class="tile-arrow">Auswählen →</span></button>
    <button class="studio-tile tile-space" onclick="goToStudio('space')"><span class="tile-emoji">🚀</span><span class="tile-name">Galaxie & Star Wars</span><span class="tile-desc">Raumschiffe, Helden, Schlachten</span><span class="tile-arrow">Auswählen →</span></button>
    <button class="studio-tile tile-trains" onclick="goToStudio('trains')"><span class="tile-emoji">🚂</span><span class="tile-name">Zugwelten</span><span class="tile-desc">Bergbahnen, Züge, Landschaften</span><span class="tile-arrow">Auswählen →</span></button>
    <button class="studio-tile tile-broken" onclick="goToStudio('broken')"><span class="tile-emoji">💥</span><span class="tile-name">3D-Durchbruch</span><span class="tile-desc">Bildrisse, Portale, Effekte</span><span class="tile-arrow">Auswählen →</span></button>
    <button class="studio-tile tile-worlds" onclick="goToStudio('worlds')"><span class="tile-emoji">🏯</span><span class="tile-name">Fantasy & Japan</span><span class="tile-desc">Magische Orte und Traumwelten</span><span class="tile-arrow">Auswählen →</span></button>
    <button class="studio-tile tile-photo" onclick="goToStudio('photo')"><span class="tile-emoji">📷</span><span class="tile-name">Foto & Technik</span><span class="tile-desc">Kamera, Objektiv, Licht</span><span class="tile-arrow">Auswählen →</span></button>
  </div>
</section>

<h2 class="section-title" id="presetTitle"></h2><div class="presets" id="presetButtons"></div>
<h2 class="section-title" id="categoryTitle"></h2>
<div class="category-toolbar">
  <input id="categorySearch" class="category-search" type="search" placeholder="Bereiche suchen …" oninput="renderCategories()">
  <div class="category-tabs" id="categoryTabs">
    <button type="button" class="tab active" data-group="all" onclick="setCategoryGroup('all')">Alle</button>
    <button type="button" class="tab" data-group="people" onclick="setCategoryGroup('people')">Person & Beauty</button>
    <button type="button" class="tab" data-group="worlds" onclick="setCategoryGroup('worlds')">Welten & Fantasy</button>
    <button type="button" class="tab" data-group="space" onclick="setCategoryGroup('space')">Galaxie</button>
    <button type="button" class="tab" data-group="trains" onclick="setCategoryGroup('trains')">Zugwelten</button>
    <button type="button" class="tab" data-group="broken" onclick="setCategoryGroup('broken')">3D-Durchbruch</button>
    <button type="button" class="tab" data-group="photo" onclick="setCategoryGroup('photo')">Foto & Technik</button>
  </div>
</div>
<div class="categories" id="categoriesContainer"></div>
<section id="selectionArea"><div class="selection-header"><h2 id="selectionTitle"></h2><button class="close-selection" onclick="closeSelection()" id="closeButton"></button></div><p class="hint" id="selectionHint"></p><div class="options" id="optionsContainer"></div></section>
<section class="panel"><h2 id="overviewTitle"></h2><div class="selected-list" id="selectedList"></div></section>
<section class="panel"><h2 id="referenceTitle"></h2><p id="referenceText"></p><input class="file-input" type="file" accept="image/*" onchange="previewImage(event)"><div class="reference-preview" id="referencePreview"><img id="previewImage" alt="Reference"></div></section>
<section class="panel"><h2 id="promptTitle"></h2><textarea id="promptOutput"></textarea><div class="prompt-info"><span id="editInfo"></span><span id="characterCount"></span></div>
<div class="button-grid">
<button class="primary" onclick="copyPrompt()" id="copyButton"></button><button class="green" onclick="savePrompt()" id="saveButton"></button>
<button class="orange" onclick="randomPrompt()" id="randomButton"></button><button class="secondary" onclick="exportData()" id="exportButton"></button>
<button class="secondary" onclick="importData()" id="importButton"></button><button class="danger" onclick="resetAll()" id="resetButton"></button>
</div><div class="status" id="status"></div></section>
<section class="panel"><h2 id="libraryTitle"></h2><input class="library-search" id="librarySearch" oninput="renderSavedPrompts()"><div id="savedPrompts"></div></section>
</main><footer>🎨 ArtStyle Studio V6.4 · Creative Worlds · Dirk Eckert</footer>

let activeCategoryGroup="all";
function categoryGroup(id){
 if(id.startsWith("space")||["galaxyScene","spacecraft","spaceCharacters","spaceWorlds","spaceEffects"].includes(id))return "space";
 if(id.startsWith("train"))return "trains";
 if(id.startsWith("broken"))return "broken";
 if(["person","hair","hairColor","makeup","clothing","hosiery","shoes","pose"].includes(id)||id.startsWith("beauty")||id==="expression")return "people";
 if(["camera","lens","lighting","realism","format","composition"].includes(id))return "photo";
 if(["japan","landscape","style","mood","fantasy"].includes(id))return "worlds";
 return "all";
}
function goToStudio(group){

}
function setCategoryGroup(group){

}
function renderCategories(){
 const box=document.getElementById("categoriesContainer");box.innerHTML="";
 const query=(document.getElementById("categorySearch")?.value||"").toLocaleLowerCase();
 CATEGORIES.forEach(([id,icon,multi,names])=>{
   const title=txt(names);
   if(activeCategoryGroup!=="all"&&categoryGroup(id)!==activeCategoryGroup)return;
   if(query&&!title.toLocaleLowerCase().includes(query)&&!id.toLocaleLowerCase().includes(query))return;
   const count=getSelectionCount(id),card=document.createElement("div");card.className="card"+(count?" has-selection":"");
   card.setAttribute("role","button");card.tabIndex=0;card.onclick=()=>openCategory(id);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCategory(id)}};card.innerHTML=`<div class="selection-badge">${count}</div><div class="card-icon">${icon}</div><div class="card-title">${title}</div>`;box.appendChild(card);
 });
}
function openCategory(id){
 currentCategory=id;const c=catById(id),t=LANGS[currentLanguage];document.getElementById("selectionArea").style.display="block";document.getElementById("selectionTitle").textContent=c[1]+" "+txt(c[3]);document.getElementById("selectionHint").textContent=c[2]?t.multi:t.single;

}
