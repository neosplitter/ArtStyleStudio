<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">

<title>ArtStyle Studio – Dirk Eckert</title>
<style>
:root{
  --bg:#080a10;--bg2:#101524;--card:#151a28;--card2:#20263a;
  --border:#39425c;--purple:#8b5cf6;--pink:#ec4899;--green:#22c55e;
  --orange:#f59e0b;--red:#ef4444;--text:#fff;--muted:#aeb6cf;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:
radial-gradient(circle at top,#241044 0%,#0d1020 40%,#080a10 75%);min-height:100vh}
header{padding:18px 16px 32px;text-align:center;background:linear-gradient(135deg,#16002b,#111827,#31004f);border-bottom:1px solid #5b3b78}
.topbar{max-width:1200px;margin:auto;display:flex;justify-content:flex-end}
select,input,textarea{font:inherit}
.language-select{width:auto;min-width:180px;padding:12px 14px;border-radius:14px;background:#171a26;color:white;border:1px solid #555d76}
.logo{font-size:52px;margin:10px 0 6px} h1{margin:0;font-size:40px}.name{margin-top:8px;font-size:21px;color:#c084fc;font-weight:bold}.subtitle{margin-top:12px;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:25px 16px 70px}
.hero{padding:28px;border-radius:28px;background:linear-gradient(135deg,#5b087c,#9d004f);box-shadow:0 15px 45px rgba(0,0,0,.4);margin-bottom:25px}
.hero h2{margin-top:0}.hero p{line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;text-align:center}.stat-number{font-size:28px;font-weight:bold;color:#c084fc}.stat-label{margin-top:5px;font-size:13px;color:var(--muted)}
.section-title{margin:35px 0 18px;font-size:28px}
.presets{display:flex;flex-wrap:wrap;gap:10px}.preset{width:auto;margin:0;padding:12px 16px;background:#242b40;border:1px solid #49526b;border-radius:30px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{position:relative;min-height:140px;padding:18px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:22px;cursor:pointer;transition:.18s;user-select:none}.card:hover{transform:translateY(-3px);border-color:var(--purple);background:var(--card2)}.card:active{transform:scale(.97)}.card:focus-visible,.option:focus-visible,button:focus-visible{outline:3px solid #c084fc;outline-offset:3px}.card.has-selection{border-color:var(--green);box-shadow:0 0 20px rgba(34,197,94,.15)}.card-icon{font-size:42px;margin-bottom:12px}.card-title{font-weight:bold;text-align:center}.selection-badge{display:none;position:absolute;top:10px;right:12px;min-width:25px;padding:4px 7px;border-radius:20px;background:var(--green);color:#06120a;font-size:12px;font-weight:bold}.card.has-selection .selection-badge{display:block}
#selectionArea{display:none;margin-top:28px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:25px}.selection-header{display:flex;align-items:center;justify-content:space-between;gap:15px}.selection-header h2{margin:0}.hint{color:var(--muted);line-height:1.5}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{position:relative;padding:15px 12px;text-align:center;background:var(--card2);border:2px solid #414960;border-radius:16px;cursor:pointer;transition:.15s}.option.active{background:#193727;border-color:var(--green)}.option.active:after{content:"✓";position:absolute;top:7px;right:10px;color:var(--green);font-weight:bold}
.panel{margin-top:30px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:25px}.selected-list{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border-radius:25px;background:#252d43;border:1px solid #46506c;font-size:14px}.chip strong{color:#c084fc}.empty{color:var(--muted)}
.file-input{width:100%;padding:14px;background:#0b0e16;border:1px dashed #5b6584;border-radius:15px;color:white}.reference-preview{display:none;margin-top:18px;text-align:center}.reference-preview img{max-width:100%;max-height:400px;border-radius:18px;border:2px solid var(--purple)}
textarea{width:100%;min-height:280px;padding:16px;resize:vertical;background:#080b12;color:white;border:2px solid #39435c;border-radius:17px;font-size:16px;line-height:1.55}textarea:focus{outline:none;border-color:var(--purple)}.prompt-info{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:13px}
.button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}button{padding:16px;border:none;border-radius:15px;color:white;font:inherit;font-size:16px;font-weight:bold;cursor:pointer}button:active{transform:scale(.97)}.primary{background:linear-gradient(135deg,#7c3aed,#db2777)}.green{background:linear-gradient(135deg,#15803d,#22c55e)}.orange{background:linear-gradient(135deg,#b45309,#f59e0b)}.secondary{background:linear-gradient(135deg,#334155,#111827)}.danger{background:linear-gradient(135deg,#7f1d1d,#ef4444)}.small-button{width:auto;margin:0;padding:9px 12px;font-size:13px;background:#293149}.close-selection{width:auto;margin:0;padding:10px 14px;background:#293149;font-size:14px}.status{min-height:25px;margin-top:15px;text-align:center;color:#86efac}
.library-search{width:100%;padding:14px;margin-bottom:15px;background:#0b0e16;color:white;border:1px solid #424b64;border-radius:14px}.saved-prompt{margin-top:12px;padding:16px;background:#0c101a;border:1px solid #333c52;border-radius:16px}.saved-header{display:flex;justify-content:space-between;gap:10px}.saved-title{color:#c084fc;font-weight:bold}.saved-text{margin-top:10px;color:#c5ccdf;line-height:1.5;font-size:14px;white-space:pre-wrap}.saved-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
body.rtl{direction:rtl}body.rtl .topbar{justify-content:flex-start}body.rtl .selection-badge,body.rtl .option.active:after{right:auto;left:10px}
footer{padding:35px 10px;text-align:center;color:#717a92}
@media(max-width:650px){h1{font-size:32px}.stats,.options,.button-grid{grid-template-columns:1fr}.categories{gap:11px}.card{min-height:125px}.card-icon{font-size:37px}.card-title{font-size:15px}.prompt-info{flex-direction:column}}
</style>
</head>

<header>
  <div class="topbar"><select id="languageSelector" class="language-select"></select></div>
  <div class="logo">🎨✨</div><h1>ArtStyle Studio</h1><div class="name">Dirk Eckert</div>
  <div class="subtitle" id="subtitle"></div>
</header>
<main>
<section class="hero"><h2 id="welcomeTitle"></h2><p id="welcomeText"></p></section>
<div class="stats">
 <div class="stat"><div class="stat-number" id="selectedCount">0</div><div class="stat-label" id="selectedLabel"></div></div>
 <div class="stat"><div class="stat-number" id="categoryCount">0</div><div class="stat-label" id="categoryLabel"></div></div>
 <div class="stat"><div class="stat-number" id="savedCount">0</div><div class="stat-label" id="savedLabel"></div></div>
</div>
<h2 class="section-title" id="presetTitle"></h2><div class="presets" id="presetButtons"></div>
<h2 class="section-title" id="categoryTitle"></h2><div class="categories" id="categoriesContainer"></div>
<section id="selectionArea"><div class="selection-header"><h2 id="selectionTitle"></h2><button class="close-selection" onclick="closeSelection()" id="closeButton"></button></div><p class="hint" id="selectionHint"></p><div class="options" id="optionsContainer"></div></section>
<section class="panel"><h2 id="overviewTitle"></h2><div class="selected-list" id="selectedList"></div></section>
<section class="panel"><h2 id="referenceTitle"></h2><p id="referenceText"></p><input class="file-input" type="file" accept="image/*" onchange="previewImage(event)"><div class="reference-preview" id="referencePreview"><img id="previewImage" alt="Reference"></div></section>
<section class="panel"><h2 id="promptTitle"></h2><textarea id="promptOutput"></textarea><div class="prompt-info"><span id="editInfo"></span><span id="characterCount"></span></div>
<div class="button-grid">
<button class="primary" onclick="copyPrompt()" id="copyButton"></button><button class="green" onclick="savePrompt()" id="saveButton"></button>
<button class="orange" onclick="randomPrompt()" id="randomButton"></button><button class="secondary" onclick="exportData()" id="exportButton"></button>
<button class="secondary" onclick="importData()" id="importButton"></button><button class="danger" onclick="resetAll()" id="resetButton"></button>
</div><div class="status" id="status"></div></section>
<section class="panel"><h2 id="libraryTitle"></h2><input class="library-search" id="librarySearch" oninput="renderSavedPrompts()"><div id="savedPrompts"></div></section>
</main><footer>🎨 ArtStyle Studio V5.3 · Dirk Eckert</footer>

const IDX={de:0,en:1,es:2,fr:3,ar:4};
let currentLanguage=localStorage.getItem("artstyleLanguage")||"de";
let selectedValues={};
let currentCategory=null;

function tr(key){return LANGS[currentLanguage][key]}
function txt(obj){return obj[currentLanguage]}
function optionText(id){return O[id][IDX[currentLanguage]]}
function catById(id){return CATEGORIES.find(c=>c[0]===id)}

function init(){
  const sel=document.getElementById("languageSelector");
  Object.keys(LANGS).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=LANGS[k].name;sel.appendChild(o)});
  sel.value=currentLanguage; sel.onchange=e=>changeLanguage(e.target.value);
  loadCurrentSelection(); applyLanguage(); renderCategories(); updateEverything(); renderSavedPrompts();
}
function changeLanguage(l){currentLanguage=l;localStorage.setItem("artstyleLanguage",l);applyLanguage();renderCategories();renderOverview();updatePrompt();renderSavedPrompts()}
function applyLanguage(){
  const t=LANGS[currentLanguage];document.documentElement.lang=currentLanguage;document.documentElement.dir=currentLanguage==="ar"?"rtl":"ltr";document.body.classList.toggle("rtl",currentLanguage==="ar");
  const map={subtitle:"subtitle",welcomeTitle:"welcomeTitle",welcomeText:"welcomeText",selectedLabel:"selectedLabel",categoryLabel:"categoryLabel",savedLabel:"savedLabel",presetTitle:"presetTitle",categoryTitle:"categoryTitle",closeButton:"close",overviewTitle:"overview",referenceTitle:"referenceTitle",referenceText:"referenceText",promptTitle:"promptTitle",editInfo:"editInfo",copyButton:"copy",saveButton:"save",randomButton:"random",exportButton:"export",importButton:"import",resetButton:"reset",libraryTitle:"library"};
  Object.entries(map).forEach(([id,key])=>document.getElementById(id).textContent=t[key]);
  document.getElementById("promptOutput").placeholder=t.placeholder;document.getElementById("librarySearch").placeholder=t.search;
  renderPresets();
}
function renderPresets(){
 const labels={
 de:["🎬 Kino","👗 Luxus-Fashion","📸 Portrait","🌌 Fantasy","🇯🇵 Japan","🌀 Traumwelt","🪄 Sternenportal","💥 3D-Durchbruch","🎨 Neo Abstract","🌙 Mystisch","🌺 Floral Luxury","⌛ Surreale Zeit","🌈 Farbexplosion","🏰 Fantasy-Architektur","💗 Romantic Dream"],
 en:["🎬 Cinematic","👗 Luxury Fashion","📸 Portrait","🌌 Fantasy","🇯🇵 Japan","🌀 Dream World","🪄 Star Portal","💥 3D Breakthrough","🎨 Neo Abstract","🌙 Mystical","🌺 Floral Luxury","⌛ Surreal Time","🌈 Color Explosion","🏰 Fantasy Architecture","💗 Romantic Dream"],
 es:["🎬 Cine","👗 Moda de lujo","📸 Retrato","🌌 Fantasía","🇯🇵 Japón","🌀 Mundo onírico","🪄 Portal estelar","💥 Ruptura 3D","🎨 Neoabstracto","🌙 Místico","🌺 Lujo floral","⌛ Tiempo surrealista","🌈 Explosión de color","🏰 Arquitectura fantástica","💗 Sueño romántico"],
 fr:["🎬 Cinéma","👗 Mode de luxe","📸 Portrait","🌌 Fantaisie","🇯🇵 Japon","🌀 Monde onirique","🪄 Portail stellaire","💥 Percée 3D","🎨 Néo-abstrait","🌙 Mystique","🌺 Luxe floral","⌛ Temps surréaliste","🌈 Explosion de couleurs","🏰 Architecture fantastique","💗 Rêve romantique"],
 ar:["🎬 سينمائي","👗 أزياء فاخرة","📸 بورتريه","🌌 خيال","🇯🇵 اليابان","🌀 عالم الأحلام","🪄 بوابة نجمية","💥 اختراق ثلاثي الأبعاد","🎨 تجريد حديث","🌙 غامض","🌺 زهور فاخرة","⌛ زمن سريالي","🌈 انفجار ألوان","🏰 عمارة خيالية","💗 حلم رومانسي"]
 };
 const ids=["cinematic","fashion","portrait","fantasy","japan","dreamworld","portal","broken","neo","mystical","floral","time","color","architecture","romantic"];
 const box=document.getElementById("presetButtons");box.innerHTML="";
 ids.forEach((id,i)=>{const b=document.createElement("button");b.className="preset";b.textContent=labels[currentLanguage][i];b.onclick=()=>loadPreset(id);box.appendChild(b)});
}
function renderCategories(){
 const box=document.getElementById("categoriesContainer");box.innerHTML="";
 CATEGORIES.forEach(([id,icon,multi,names])=>{
   const count=getSelectionCount(id),card=document.createElement("div");card.className="card"+(count?" has-selection":"");
   card.setAttribute("role","button");card.tabIndex=0;card.onclick=()=>openCategory(id);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCategory(id)}};card.innerHTML=`<div class="selection-badge">${count}</div><div class="card-icon">${icon}</div><div class="card-title">${txt(names)}</div>`;box.appendChild(card);
 });
}
function openCategory(id){
 currentCategory=id;const c=catById(id),t=LANGS[currentLanguage];document.getElementById("selectionArea").style.display="block";document.getElementById("selectionTitle").textContent=c[1]+" "+txt(c[3]);document.getElementById("selectionHint").textContent=c[2]?t.multi:t.single;
 const box=document.getElementById("optionsContainer");box.innerHTML="";
 c[4].forEach(opt=>{const e=document.createElement("div");e.className="option"+(isSelected(id,opt)?" active":"");e.textContent=optionText(opt);e.onclick=()=>{toggleOption(id,opt);openCategory(id);updateEverything()};box.appendChild(e)});
 setTimeout(()=>document.getElementById("selectionArea").scrollIntoView({behavior:"smooth",block:"start"}),50);
}
function toggleOption(id,opt){const c=catById(id);if(c[2]){if(!selectedValues[id])selectedValues[id]=[];const i=selectedValues[id].indexOf(opt);if(i>=0){selectedValues[id].splice(i,1);if(!selectedValues[id].length)delete selectedValues[id]}else selectedValues[id].push(opt)}else{if(selectedValues[id]===opt)delete selectedValues[id];else selectedValues[id]=opt}}
function isSelected(id,opt){const v=selectedValues[id];return Array.isArray(v)?v.includes(opt):v===opt}
function getSelectionCount(id){const v=selectedValues[id];return !v?0:Array.isArray(v)?v.length:1}
function getParts(){const a=[];CATEGORIES.forEach(c=>{const v=selectedValues[c[0]];if(!v)return;(Array.isArray(v)?v:[v]).forEach(x=>a.push(optionText(x)))});return a}
function updatePrompt(){const parts=getParts(),out=document.getElementById("promptOutput");out.value=parts.length?tr("promptStart")+parts.join(", ")+". "+tr("quality"):"";updateCharacterCount()}
function renderOverview(){const box=document.getElementById("selectedList");box.innerHTML="";let any=false;CATEGORIES.forEach(c=>{const v=selectedValues[c[0]];if(!v)return;any=true;(Array.isArray(v)?v:[v]).forEach(x=>{const d=document.createElement("div");d.className="chip";d.innerHTML="<strong>"+txt(c[3])+":</strong> "+escapeHtml(optionText(x));box.appendChild(d)})});if(!any)box.innerHTML='<div class="empty">'+tr("empty")+"</div>"}
function updateStats(){let e=0,k=0;Object.values(selectedValues).forEach(v=>{k++;e+=Array.isArray(v)?v.length:1});document.getElementById("selectedCount").textContent=e;document.getElementById("categoryCount").textContent=k;document.getElementById("savedCount").textContent=getSavedPrompts().length}
function updateEverything(){updatePrompt();renderOverview();renderCategories();updateStats();saveCurrentSelection()}
function updateCharacterCount(){document.getElementById("characterCount").textContent=document.getElementById("promptOutput").value.length+" Zeichen"}
document.getElementById("promptOutput").addEventListener("input",updateCharacterCount);
function previewImage(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{document.getElementById("previewImage").src=x.target.result;document.getElementById("referencePreview").style.display="block"};r.readAsDataURL(f)}
async function copyPrompt(){const v=document.getElementById("promptOutput").value;if(!v.trim())return;try{await navigator.clipboard.writeText(v)}catch{const o=document.getElementById("promptOutput");o.select();document.execCommand("copy")}setStatus(tr("copied"))}
function setStatus(m){document.getElementById("status").textContent=m}
function getSavedPrompts(){try{return JSON.parse(localStorage.getItem("artstyleSavedPrompts"))||[]}catch{return[]}}
function savePrompt(){const p=document.getElementById("promptOutput").value;if(!p.trim())return;const title=prompt(tr("saveName"),tr("defaultName"));if(!title)return;const a=getSavedPrompts();a.unshift({id:Date.now(),title,prompt:p,favorite:false,date:new Date().toLocaleString()});localStorage.setItem("artstyleSavedPrompts",JSON.stringify(a));renderSavedPrompts();updateStats();setStatus(tr("saved"))}
function escapeHtml(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function renderSavedPrompts(){const box=document.getElementById("savedPrompts"),q=document.getElementById("librarySearch").value.toLowerCase();let a=getSavedPrompts().filter(x=>x.title.toLowerCase().includes(q)||x.prompt.toLowerCase().includes(q));a.sort((x,y)=>Number(y.favorite)-Number(x.favorite));box.innerHTML="";if(!a.length){box.innerHTML='<div class="empty">'+tr("libraryEmpty")+"</div>";return}a.forEach(x=>{const d=document.createElement("div");d.className="saved-prompt";d.innerHTML=`<div class="saved-header"><div class="saved-title">${x.favorite?"⭐ ":""}${escapeHtml(x.title)}</div><small>${escapeHtml(x.date)}</small></div><div class="saved-text">${escapeHtml(x.prompt)}</div><div class="saved-actions"><button class="small-button" onclick="loadSavedPrompt(${x.id})">${tr("load")}</button><button class="small-button" onclick="copySavedPrompt(${x.id})">${tr("copySmall")}</button><button class="small-button" onclick="toggleFavorite(${x.id})">⭐</button><button class="small-button" onclick="deleteSavedPrompt(${x.id})">${tr("delete")}</button></div>`;box.appendChild(d)})}
function loadSavedPrompt(id){const x=getSavedPrompts().find(p=>p.id===id);if(!x)return;document.getElementById("promptOutput").value=x.prompt;updateCharacterCount();setStatus(tr("loaded"))}
function copySavedPrompt(id){const x=getSavedPrompts().find(p=>p.id===id);if(x){navigator.clipboard.writeText(x.prompt);setStatus(tr("copied"))}}
function toggleFavorite(id){const a=getSavedPrompts(),x=a.find(p=>p.id===id);if(x){x.favorite=!x.favorite;localStorage.setItem("artstyleSavedPrompts",JSON.stringify(a));renderSavedPrompts()}}
function deleteSavedPrompt(id){localStorage.setItem("artstyleSavedPrompts",JSON.stringify(getSavedPrompts().filter(p=>p.id!==id)));renderSavedPrompts();updateStats()}
function loadPreset(type){selectedValues={};if(type==="dreamworld"){selectedValues.surrealDream=["dreamscape","floatingIslands","impossibleWorld"];selectedValues.mood=["dreamMood","mysticMood"];selectedValues.style=["dreamlike","fineArt"]}if(type==="portal"){selectedValues.fantasyPortals=["starPortal","circularPortal","stardust"];selectedValues.lighting=["magicLight","rimLight"]}if(type==="broken"){selectedValues.brokenReality=["crackedWall","threeDBreakthrough","portalInWall"];selectedValues.composition=["dynamic","professionalComposition"]}if(type==="neo"){selectedValues.neoAbstractArt=["boldGeometry","fluidShapes","layeredColor"];selectedValues.style=["neoAbstract","fineArt"]}if(type==="mystical"){selectedValues.mysticalFantasy=["enchantedForest","celestialGlow","etherealFog"];selectedValues.mood=["mysticMood","dreamMood"]}if(type==="floral"){selectedValues.floralLuxury=["goldenFlowers","floralOrnaments","crystalPetals"];selectedValues.style=["fineArt","hyperDetailed"]}if(type==="time"){selectedValues.surrealTime=["antiqueClock","floatingClock","timeFragments"];selectedValues.mood=["mysticMood","dramaticMood"]}if(type==="color"){selectedValues.colorExplosion=["vibrantColor","paintSplashes","rainbowLayers"];selectedValues.style=["neoAbstract","hyperDetailed"]}if(type==="architecture"){selectedValues.fantasyArchitecture=["impossibleCastle","floatingCity","dreamPalace"];selectedValues.fantasy=["epic","cinematicFantasy"]}if(type==="romantic"){selectedValues.romanticDream=["moonlitRomance","rosePetals","softPastels"];selectedValues.mood=["romanticMood","dreamMood"]}if(type==="cinematic"){selectedValues.style=["cinematic","dramatic"];selectedValues.lighting=["cinematicLight","rimLight"]}if(type==="fashion"){selectedValues.style=["luxuryFashionPhoto","editorial"];selectedValues.clothing=["luxuryFashion"]}if(type==="portrait"){selectedValues.person="cinematicPortrait";selectedValues.realism=["ultraReal","naturalSkin","skinPores"];selectedValues.camera="canonR5";selectedValues.lens="lens85_14"}if(type==="fantasy"){selectedValues.fantasy=["surreal","magicLight","cinematicFantasy"]}if(type==="japan"){selectedValues.japan=["kyotoSunset","bamboo"];selectedValues.style=["fineArt","cinematic"]}updateEverything()}
function randomPrompt(){selectedValues={};CATEGORIES.forEach(c=>{if(Math.random()<.48)return;if(c[2])selectedValues[c[0]]=[...c[4]].sort(()=>Math.random()-.5).slice(0,Math.floor(Math.random()*3)+1);else selectedValues[c[0]]=c[4][Math.floor(Math.random()*c[4].length)]});updateEverything();setStatus(tr("randomDone"))}
function resetAll(){if(!confirm(tr("resetAsk")))return;selectedValues={};document.getElementById("promptOutput").value="";localStorage.removeItem("artstyleCurrentSelection");updateEverything();setStatus(tr("resetDone"))}
function saveCurrentSelection(){localStorage.setItem("artstyleCurrentSelection",JSON.stringify(selectedValues))}
function loadCurrentSelection(){try{selectedValues=JSON.parse(localStorage.getItem("artstyleCurrentSelection"))||{}}catch{selectedValues={}}}
function exportData(){const data={version:"ArtStyle Studio V5.3",language:currentLanguage,currentSelection:selectedValues,savedPrompts:getSavedPrompts()};const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="artstyle-studio-backup.json";a.click();URL.revokeObjectURL(u)}
function importData(){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{const d=JSON.parse(x.target.result);selectedValues=d.currentSelection||{};if(d.savedPrompts)localStorage.setItem("artstyleSavedPrompts",JSON.stringify(d.savedPrompts));if(d.language&&LANGS[d.language]){currentLanguage=d.language;document.getElementById("languageSelector").value=currentLanguage}changeLanguage(currentLanguage);updateEverything();renderSavedPrompts();setStatus(tr("importOK"))}catch{alert(tr("importBad"))}};r.readAsText(f)};i.click()}
function closeSelection(){document.getElementById("selectionArea").style.display="none"}
init();
</script>
